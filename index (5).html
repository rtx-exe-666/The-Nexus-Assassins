<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VidyaBot — AI Study Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#app{width:100%;max-width:480px;background:#fff;border-radius:18px;border:1px solid #e0e0e0;overflow:hidden;display:flex;flex-direction:column;height:90vh;max-height:700px;box-shadow:0 4px 24px rgba(80,80,200,0.08)}
#header{padding:14px 16px;background:linear-gradient(90deg,#6c63ff,#48b8ff);display:flex;align-items:center;gap:12px}
#header-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:20px}
#header-info{flex:1}
#header-title{font-size:17px;font-weight:700;color:#fff}
#header-sub{font-size:11px;color:rgba(255,255,255,0.85);margin-top:1px}
#lang-toggle{display:flex;gap:5px}
.lang-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.5);background:transparent;cursor:pointer;color:#fff;font-weight:500}
.lang-btn.active{background:#fff;color:#6c63ff;border-color:#fff}
#subjects{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid #f0f0f0;overflow-x:auto;flex-shrink:0}
#subjects::-webkit-scrollbar{display:none}
.subj-btn{font-size:12px;padding:5px 13px;border-radius:20px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;white-space:nowrap;color:#666;font-weight:500}
.subj-btn.active{background:#eef0ff;color:#6c63ff;border-color:#6c63ff}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.avatar.bot{background:#eef0ff}
.avatar.user{background:#e6fff5}
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.bot .bubble{background:#f5f6ff;border:1px solid #e8eaff;color:#222;border-top-left-radius:4px}
.msg.user .bubble{background:#eef0ff;border:1px solid #d0d4ff;color:#222;border-top-right-radius:4px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#eef0ff;color:#6c63ff;font-weight:600;margin-bottom:5px;letter-spacing:0.3px}
.typing{display:flex;gap:4px;align-items:center;padding:2px 0}
.dot{width:7px;height:7px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
#quick-btns{display:flex;gap:7px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid #f0f0f0}
.quick-btn{font-size:12px;padding:5px 11px;border-radius:14px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;color:#555;font-weight:500}
.quick-btn:hover{background:#f5f6ff;border-color:#b0b4ff}
#input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #f0f0f0;align-items:center}
#user-input{flex:1;padding:9px 13px;border-radius:22px;border:1.5px solid #ddd;background:#f9f9f9;color:#222;font-size:14px;font-family:inherit;outline:none}
#user-input:focus{border-color:#6c63ff;background:#fff}
#send-btn{padding:9px 18px;border-radius:22px;border:none;background:linear-gradient(90deg,#6c63ff,#48b8ff);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
#send-btn:disabled{opacity:0.5;cursor:not-allowed}
#api-warning{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 14px;font-size:12px;color:#b8860b;margin:10px 14px 0;text-align:center}
a{color:#6c63ff}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div id="header-icon">🤖</div>
    <div id="header-info">
      <div id="header-title">VidyaBot</div>
      <div id="header-sub">by The Nexus Assassins · HACKHAZARDS '26</div>
    </div>
    <div id="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('hi',this)">HI</button>
    </div>
  </div>

  <div id="subjects">
    <button class="subj-btn active" onclick="setSubject(this,'Mathematics')">📐 Maths</button>
    <button class="subj-btn" onclick="setSubject(this,'Physics')">⚡ Physics</button>
    <button class="subj-btn" onclick="setSubject(this,'Chemistry')">🧪 Chemistry</button>
    <button class="subj-btn" onclick="setSubject(this,'Computer Science')">💻 CS</button>
    <button class="subj-btn" onclick="setSubject(this,'English')">📖 English</button>
    <button class="subj-btn" onclick="setSubject(this,'General Knowledge')">🌍 GK</button>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="avatar bot">🤖</div>
      <div>
        <div class="tag">VIDYABOT</div>
        <div class="bubble">Namaste! 🙏 I am <b>VidyaBot</b>, your 24/7 AI study assistant built by <b>The Nexus Assassins</b> for HACKHAZARDS '26.<br><br>Select a subject above and ask me anything — doubts, concepts, practice questions, or exam tips! 📚</div>
      </div>
    </div>
  </div>

  <div id="quick-btns">
    <button class="quick-btn" onclick="quickAsk('Explain this topic with a simple example')">💡 Explain</button>
    <button class="quick-btn" onclick="quickAsk('Give me 3 practice questions with answers')">📝 Practice</button>
    <button class="quick-btn" onclick="quickAsk('Give me top exam tips for this subject')">🎯 Exam tips</button>
  </div>

  <div id="input-row">
    <input id="user-input" placeholder="Type your doubt here..." onkeydown="if(event.key==='Enter'){sendMsg()}"/>
    <button id="send-btn" onclick="sendMsg()">Send ➤</button>
  </div>
</div>

<script>
const API_KEY = 'YOUR_ANTHROPIC_API_KEY_HERE';
let lang = 'en';
let subject = 'Mathematics';
let history = [];
let loading = false;

function setLang(l, el) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function setSubject(el, s) {
  subject = s;
  document.querySelectorAll('.subj-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function quickAsk(text) {
  document.getElementById('user-input').value = text;
  sendMsg();
}

function addMsg(role, html, tag) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const av = role === 'bot' ? '🤖' : '👤';
  const avClass = role === 'bot' ? 'bot' : 'user';
  const tagHtml = (role === 'bot' && tag) ? `<div class="tag">${tag.toUpperCase()}</div>` : '';
  div.innerHTML = `<div class="avatar ${avClass}">${av}</div><div>${tagHtml}<div class="bubble">${html}</div></div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function addTyping() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="avatar bot">🤖</div><div><div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMsg() {
  if (loading) return;
  const inp = document.getElementById('user-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  loading = true;
  document.getElementById('send-btn').disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();

  const langNote = lang === 'hi'
    ? 'IMPORTANT: Reply entirely in Hindi using Devanagari script. Keep it simple for Indian students.'
    : 'Reply in clear simple English for Indian students (AKTU/CBSE/JEE level).';

  const system = `You are VidyaBot, a friendly and encouraging AI tutor for Indian students. Current subject: ${subject}. ${langNote} Be concise, use bullet points for lists, give examples from Indian context. Always end with a motivational line.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system, messages: history })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Sorry, could not get answer. Try again!';
    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMsg('bot', reply.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'), subject);
  } catch(e) {
    removeTyping();
    addMsg('bot', '⚠️ Error connecting to AI. Please check your API key in the code.', 'Error');
  }
  loading = false;
  document.getElementById('send-btn').disabled = false;
}
</script>
</body>
</html>
